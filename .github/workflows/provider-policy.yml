name: Provider policy

# Enforces the approved provider architecture (spec §44):
#
#   normal SMS, every country -> AWS End User Messaging   ONLY
#   India RCS                 -> Sinch                    ONLY
#   non-India RCS             -> AWS End User Messaging RCS
#   PSTN voice / SIP / IVR    -> Plivo
#   WhatsApp                  -> Meta
#   Airtel                    -> prohibited entirely
#
# MODE: blocking gate. Any violation fails the job.
#
# This workflow ran with `--expect-fail` from the migration baseline until
# 2026-09-19. In that mode the job passed WHILE violations remained and failed
# once the count reached zero, which was the signal to flip it. The count reached
# zero, so it is flipped.
#
#   160 findings / 6 failing rules  ->  0 findings / 8 passing rules
#
# Do not reintroduce --expect-fail. It exists in the script only for a migration
# that has now completed; using it again would mean a PR that reintroduces a
# prohibited provider would PASS.
#
# If this job fails on your PR, you have added one of:
#   * an SMS send through anything other than AWS End User Messaging
#   * the Sinch transport outside the approved India RCS modules
#   * Sinch voice or Sinch WhatsApp
#   * Plivo SMS
#   * SNS SMS or classic Pinpoint send_messages
#   * a retired India provider host, credential id or client
#
# Historical data is not a violation: stored provider literals describing traffic
# that really was sent that way are expected, and the scan is scoped to runtime
# code (amplify/functions, src) for exactly that reason. If you are documenting a
# retired provider, describe it without naming its hostnames or credential
# identifiers - see docs/provider-retirement-inventory.md for the convention.

on:
  push:
    branches: [stack]
  pull_request:
    branches: [stack]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-policy:
    name: Provider policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check provider policy
        run: ./scripts/check-provider-policy.sh --verbose

      - name: Summarise
        if: always()
        run: |
          echo "### Provider policy" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mode: **blocking gate**. Any violation fails this job.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ./scripts/check-provider-policy.sh 2>&1 \
            | grep -E '^  (ok|FAIL)|^        [0-9]+ violation|^PROVIDER' \
            >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
