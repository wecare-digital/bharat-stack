name: Sync Gastronomy quality branch

on:
  push:
    branches: [ stack ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gastronomy-quality
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout gastronomy-quality
        uses: actions/checkout@v7
        with:
          ref: gastronomy-quality
          fetch-depth: 0
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge latest stack
        run: |
          git fetch origin stack gastronomy-quality
          git checkout gastronomy-quality
          git merge --no-edit origin/stack
      - name: Push synchronized branch
        run: git push origin gastronomy-quality
