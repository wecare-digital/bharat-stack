name: Blog migration manifests

on:
  pull_request:
    branches: [ stack ]
    paths:
      - 'scripts/wix_blog_migrate.py'
      - 'tests/test_wix_blog_migrate.py'
      - 'migration/blog/**'
      - '.github/workflows/blog-migration-validate.yml'
  push:
    branches: [ stack ]
    paths:
      - 'scripts/wix_blog_migrate.py'
      - 'tests/test_wix_blog_migrate.py'
      - 'migration/blog/**'
      - '.github/workflows/blog-migration-validate.yml'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest boto3
      - name: Validate migration compiler and all manifests
        run: python -m pytest tests/test_wix_blog_migrate.py -q
