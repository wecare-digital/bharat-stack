# Triggered: 2026-08-21
name: One-time Google Workspace Route53 verification

on:
  push:
    branches: [ stack ]
    paths:
      - '.github/workflows/google-workspace-route53-once.yml'

permissions:
  contents: read

jobs:
  apply-google-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify account and upsert only Google verification DNS records
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_ACCOUNT='775261844268'
          ROOT_DOMAIN='wecare.digital.'
          CNAME_NAME='qu75cp2vx25y.wecare.digital.'
          CNAME_TARGET='gv-jipfxur7egi32x.dv.googlehosted.com'
          GOOGLE_TXT='"google-site-verification=G74l7Vaf6_5214FKtpjHqCkaw4wQ6TEc2qMmVlRSg0k"'

          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          echo "AWS caller account: $ACCOUNT"
          if [ "$ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Refusing to change DNS. Expected AWS account $EXPECTED_ACCOUNT but credentials belong to $ACCOUNT."
            exit 42
          fi

          ZONE_ID="$(aws route53 list-hosted-zones-by-name \
            --dns-name wecare.digital \
            --query "HostedZones[?Name=='wecare.digital.'] | [0].Id" \
            --output text | sed 's#^/hostedzone/##')"

          if [ -z "$ZONE_ID" ] || [ "$ZONE_ID" = 'None' ]; then
            echo "::error::No Route53 hosted zone named wecare.digital. found in account $ACCOUNT."
            exit 43
          fi
          echo "Hosted zone: $ZONE_ID"

          EXISTING_TXT="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$ROOT_DOMAIN' && Type=='TXT'] | [0].ResourceRecords[].Value" \
            --output json)"
          TXT_TTL="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$ROOT_DOMAIN' && Type=='TXT'] | [0].TTL" \
            --output text)"
          if [ -z "$TXT_TTL" ] || [ "$TXT_TTL" = 'None' ]; then TXT_TTL=300; fi

          TXT_RECORDS="$(jq -c --arg google "$GOOGLE_TXT" '
            (if . == null then [] else . end) + [$google]
            | unique
            | map({Value: .})
          ' <<<"$EXISTING_TXT")"

          CURRENT_CNAME="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$CNAME_NAME' && Type=='CNAME'] | [0].ResourceRecords[0].Value" \
            --output text)"
          CNAME_TTL="$(aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$CNAME_NAME' && Type=='CNAME'] | [0].TTL" \
            --output text)"
          if [ -z "$CNAME_TTL" ] || [ "$CNAME_TTL" = 'None' ]; then CNAME_TTL=300; fi

          if [ -n "$CURRENT_CNAME" ] && [ "$CURRENT_CNAME" != 'None' ] \
             && [ "$CURRENT_CNAME" != "$CNAME_TARGET" ] \
             && [ "$CURRENT_CNAME" != "$CNAME_TARGET." ]; then
            echo "::error::$CNAME_NAME already exists and points to $CURRENT_CNAME. Refusing to overwrite it."
            exit 44
          fi

          jq -n \
            --argjson txtRecords "$TXT_RECORDS" \
            --argjson txtTtl "$TXT_TTL" \
            --argjson cnameTtl "$CNAME_TTL" \
            --arg cnameTarget "$CNAME_TARGET" \
            '{
              Comment: "Google Workspace domain verification",
              Changes: [
                {
                  Action: "UPSERT",
                  ResourceRecordSet: {
                    Name: "wecare.digital.",
                    Type: "TXT",
                    TTL: $txtTtl,
                    ResourceRecords: $txtRecords
                  }
                },
                {
                  Action: "UPSERT",
                  ResourceRecordSet: {
                    Name: "qu75cp2vx25y.wecare.digital.",
                    Type: "CNAME",
                    TTL: $cnameTtl,
                    ResourceRecords: [ { Value: $cnameTarget } ]
                  }
                }
              ]
            }' > change-batch.json

          CHANGE_ID="$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --change-batch file://change-batch.json \
            --query ChangeInfo.Id \
            --output text)"

          echo "Route53 change submitted: $CHANGE_ID"
          aws route53 wait resource-record-sets-changed --id "$CHANGE_ID"
          echo 'Route53 reports the change as INSYNC.'

          echo 'Final TXT record set:'
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$ROOT_DOMAIN' && Type=='TXT']" \
            --output json

          echo 'Final verification CNAME:'
          aws route53 list-resource-record-sets \
            --hosted-zone-id "$ZONE_ID" \
            --query "ResourceRecordSets[?Name=='$CNAME_NAME' && Type=='CNAME']" \
            --output json
