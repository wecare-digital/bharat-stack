name: Deploy docs-scraper (container Lambda)

# Builds the Playwright/Chromium container image and deploys wecare-docs-scraper.
# Runs on a CI runner (has Docker) — solves the "no Docker locally" blocker.
#
# AWS authentication uses GitHub OIDC and a least-privilege deploy role in
# account 775261844268. No long-lived AWS access keys are stored in GitHub.
#
# The container is built from the repository root because handler.py imports the
# shared lambda_utils package; the Dockerfile copies only the function files and
# that shared package into the Lambda image.

on:
  workflow_dispatch: {}
  push:
    # `stack` is the only long-lived branch and is origin/HEAD; there is no
    # `main` in this repository (see .kiro/steering/git-workflow.md). This
    # trigger named `main`, so the path filter below could never fire and
    # wecare-docs-scraper only ever deployed by manual dispatch.
    branches: [ stack ]
    paths:
      - 'amplify/functions/operations/docs-scraper/**'
      - '.github/workflows/docs-scraper-deploy.yml'

env:
  AWS_REGION: us-east-1
  ACCOUNT_ID: '775261844268'
  ECR_REPO: wecare-docs-scraper
  FUNCTION: wecare-docs-scraper
  FUNCTION_DIR: amplify/functions/operations/docs-scraper

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          # THE ROLE NAME KEEPS "bharat-stack" ON PURPOSE. The GitHub repository was renamed
          # to wecare-digital/wecare-digital; this is an AWS IAM role, which was NOT renamed
          # with it. Editing this string to match the new repo name would point at a role that
          # does not exist.
          #
          # WHAT THE RENAME DOES BREAK, and it is not visible from here: this job authenticates
          # by OIDC (id-token: write above), and the token's `sub` claim carries the repository
          # path - repo:wecare-digital/<name>:ref:... . The role's TRUST POLICY matches on that
          # claim, so if it still names the old path this step fails with
          #   Not authorized to perform sts:AssumeRoleWithWebIdentity
          # which reads as a credentials problem rather than a rename consequence. The fix is
          # on the AWS side - update the trust policy's sub condition - not in this file.
          # Four workflows assume a role this way: this one, seo-tools-deploy, plivo-drift and
          # route-auth.
          role-to-assume: arn:aws:iam::775261844268:role/GitHubActions-bharat-stack-docs-scraper
          role-session-name: bharat-stack-docs-scraper
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION"

      - name: Ensure Lambda can pull from ECR (repository policy)
        run: |
          aws ecr set-repository-policy --repository-name "$ECR_REPO" --region "$AWS_REGION" \
            --policy-text "file://$FUNCTION_DIR/ecr-policy.json" || true

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # --provenance=false --sbom=false IS LOAD-BEARING. Lambda cannot run an image
      # published as an OCI image INDEX, and BuildKit produces one as soon as it has an
      # attestation to attach - the index exists to point at the image and the
      # attestation together.
      #
      # Measured in ECR, which is why this is stated rather than guessed:
      #
      #   08:24 on ubuntu-24.04  application/vnd.docker.distribution.manifest.v2+json
      #   16:04 on ubuntu-26.04  application/vnd.oci.image.index.v1+json
      #                          + a 1710-byte attestation manifest beside it
      #
      # The second one deployed as far as update-function-code and then failed with
      #   The image manifest, config or layer media type for the source image ...
      #   is not supported.
      # which does not mention attestations, indexes or BuildKit, and so reads as a
      # broken image rather than as a default that changed underneath us. Nothing in
      # this repo changed; the newer BuildKit on the 26.04 runner attests by default.
      #
      # Turning both off restores a single-manifest image. Do not remove these flags to
      # "get supply-chain attestation" without first checking that Lambda accepts an
      # index - as of this change it does not, and the failure surfaces only at deploy
      # time, after a gigabyte has already been pushed.
      - name: Build & push image
        run: |
          IMAGE="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${GITHUB_SHA::7}"
          IMAGE_LATEST="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest"
          docker build --provenance=false --sbom=false \
            -f "$FUNCTION_DIR/Dockerfile" -t "$IMAGE" -t "$IMAGE_LATEST" .
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # FAIL HERE, NOT IN LAMBDA. The error Lambda returns for an index names media
      # types and not the cause, and it arrives after the push. Asserting the manifest
      # type against what ECR actually stored turns that into one line naming the
      # exact problem, and it costs a single read.
      - name: Assert the pushed manifest is one Lambda can run
        run: |
          MT=$(aws ecr describe-images --repository-name "$ECR_REPO" \
                 --image-ids imageTag="${GITHUB_SHA::7}" --region "$AWS_REGION" \
                 --query 'imageDetails[0].imageManifestMediaType' --output text)
          echo "manifest media type: $MT"
          case "$MT" in
            *manifest.list.v1+json|*image.index.v1+json)
              echo "::error::Pushed a manifest INDEX ($MT). Lambda cannot run it." \
                   "BuildKit attached an attestation - check --provenance/--sbom above."
              exit 1
              ;;
            *manifest.v2+json|*image.manifest.v1+json)
              echo "ok - single manifest, supported by Lambda"
              ;;
            *)
              echo "::error::Unrecognised manifest media type: $MT"
              exit 1
              ;;
          esac

      - name: Create or update Lambda
        run: |
          if aws lambda get-function --function-name "$FUNCTION" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$FUNCTION" \
              --image-uri "$IMAGE" --region "$AWS_REGION"
          else
            aws lambda create-function --function-name "$FUNCTION" \
              --package-type Image \
              --code ImageUri="$IMAGE" \
              --role "arn:aws:iam::$ACCOUNT_ID:role/wecare-digital-lambda-role" \
              --timeout 300 --memory-size 2048 --region "$AWS_REGION"
          fi

      - name: Ensure daily EventBridge trigger
        run: |
          aws events put-rule --name wecare-docs-scraper-daily \
            --schedule-expression "rate(1 day)" --region "$AWS_REGION"
          aws lambda add-permission --function-name "$FUNCTION" --statement-id docs-cron \
            --action lambda:InvokeFunction --principal events.amazonaws.com \
            --source-arn "arn:aws:events:$AWS_REGION:$ACCOUNT_ID:rule/wecare-docs-scraper-daily" \
            --region "$AWS_REGION" 2>/dev/null || true
          aws events put-targets --rule wecare-docs-scraper-daily \
            --targets "Id"="1","Arn"="arn:aws:lambda:$AWS_REGION:$ACCOUNT_ID:function:$FUNCTION" \
            --region "$AWS_REGION"
