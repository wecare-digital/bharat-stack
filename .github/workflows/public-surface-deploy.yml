name: Public surface deploy

# THE TWO SCRIPTS THAT HAD NO WAY TO RUN.
#
# scripts/provision_legacy_redirects.py and scripts/deploy_mcp_server.py both mutate live AWS,
# and neither was wired into any workflow - `grep -rl` across .github/workflows found nothing.
# That meant the only path was a person with console or CLI credentials on their own machine, and
# the consequence showed up the moment /my-order became /orders: the source of truth was correct
# in the repo (config/public-pages.json, the sitemap, out/llms.txt) while the live 301 and the
# Lambda's bundled catalogue stayed stale, with no button anyone could press.
#
# TWO ROLES, NOT ONE, AND THE WRITE ONE IS HELD FOR AS SHORT A TIME AS POSSIBLE.
# The first version of this workflow ran everything in a single job on a single role that could
# write, because one job was simpler than three. The cost of that convenience is that a
# read-only check carried amplify:UpdateApp, lambda:UpdateFunctionCode and iam:PassRole for its
# whole duration - so a mistake in a verify path, or anything compromised between checkout and
# the verify command, held production write access it never needed. Now:
#
#   verify   -> vars.PUBLIC_SURFACE_READ_ROLE_ARN   Get* only. Cannot change anything.
#   apply    -> vars.PUBLIC_SURFACE_ROLE_ARN        writes, and does nothing else.
#   confirm  -> vars.PUBLIC_SURFACE_READ_ROLE_ARN   proves the apply worked, on a credential
#                                                    that could not have caused the result.
#
# That last line is the part worth keeping: a deploy that verifies itself with its own write
# credential is checking its work with the same hand that did it. Confirming on the read role
# means the evidence comes from a principal with no ability to have produced it.
# tests/test_github_oidc_trust_policy.py asserts the read document contains nothing but Get
# actions, so "read-only" is a property rather than a filename.
#
# BOTH SCRIPTS WRITE THE SAME AMPLIFY customRules ARRAY, which is why the apply steps are
# sequential inside one job rather than two parallel jobs. provision_legacy_redirects.py rebuilds
# that array and deploy_mcp_server.py writes the /mcp rewrite into it; run concurrently,
# whichever called update_app second would clobber the other. The redirects go FIRST because
# provision_legacy_redirects.py preserves rules it does not own and refuses to run if it cannot
# find the catch-all, so letting it settle the list before the MCP rewrite is added keeps the
# ordering the catch-all depends on. The workflow-level concurrency group stops two runs
# overlapping for the same reason.
#
# NO `needs: verify` ON THE APPLY JOB, deliberately. It reads like the obvious safety gate and it
# would make the workflow unusable: verify FAILS when the deployed catalogue is stale, which is
# exactly the state you run apply to fix. Gating apply on a green verify would mean apply could
# only run once it was no longer needed. The dispatch input is the gate - a human chose `apply`.
#
# DISPATCH-ONLY, NO SCHEDULE. Every other AWS-touching workflow here crons a read-only drift
# check, which is the right shape for a checker; these WRITE, so a push trigger would let a merge
# rewrite production routing unwatched. A verify-only cron is now cheap to add - the read role
# exists for it - and is a reasonable follow-up once the roles are provisioned. It is left out
# today only because a scheduled job that stays red until a human acts is noise, not signal.
#
# WHAT IT NEEDS BEFORE IT CAN WORK: two OIDC roles and two repository variables. There is no
# AWS_ACCESS_KEY_ID / SECRET / SESSION_TOKEN secret to reuse - this project authenticates
# entirely by role assumption, so long-lived keys do not exist anywhere by design. The four
# commands, the policy documents and the rollback are in scripts/iam-public-surface-README.md.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'verify = read-only check. apply = write to production, then confirm.'
        required: true
        default: verify
        type: choice
        options: [verify, apply]
      target:
        description: 'Which surface to act on.'
        required: true
        default: both
        type: choice
        options: [both, redirects, mcp]

permissions:
  contents: read
  id-token: write   # for the OIDC role assumption

# Never two runs at once: both halves write the same Amplify customRules array.
concurrency:
  group: public-surface-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: verify (read-only)
    if: inputs.action == 'verify'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned AWS SDK
        run: |
          grep -E '^(boto3|botocore)==' requirements-dev.txt > ci-aws-requirements.txt
          python -m pip install -r ci-aws-requirements.txt
      - name: Check the read role variable is set
        run: |
          if [ -z "${{ vars.PUBLIC_SURFACE_READ_ROLE_ARN }}" ]; then
            echo "::error::vars.PUBLIC_SURFACE_READ_ROLE_ARN is not set. See scripts/iam-public-surface-README.md for the two roles this workflow needs and the commands that create them."
            exit 1
          fi
      - name: Assume the read-only role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUBLIC_SURFACE_READ_ROLE_ARN }}
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity
      - name: Report the redirect rules
        if: inputs.target == 'both' || inputs.target == 'redirects'
        run: python scripts/provision_legacy_redirects.py
      - name: Verify the retired URLs resolve
        if: inputs.target == 'both' || inputs.target == 'redirects'
        run: python scripts/provision_legacy_redirects.py --verify
      # This is the check dd561bdc added: it fails when the live wecare-mcp is serving a page
      # catalogue that disagrees with config/public-pages.json, which is the state the /orders
      # rename left it in. It reads the deployed bundle, which is why the read role needs
      # lambda:GetFunction and not only GetFunctionConfiguration.
      - name: Verify the MCP Lambda and its catalogue
        if: inputs.target == 'both' || inputs.target == 'mcp'
        run: python scripts/deploy_mcp_server.py --verify

  apply:
    name: apply (writes)
    if: inputs.action == 'apply'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned AWS SDK
        run: |
          grep -E '^(boto3|botocore)==' requirements-dev.txt > ci-aws-requirements.txt
          python -m pip install -r ci-aws-requirements.txt
      - name: Check the write role variable is set
        run: |
          if [ -z "${{ vars.PUBLIC_SURFACE_ROLE_ARN }}" ]; then
            echo "::error::vars.PUBLIC_SURFACE_ROLE_ARN is not set. See scripts/iam-public-surface-README.md for the two roles this workflow needs and the commands that create them."
            exit 1
          fi
      - name: Assume the write role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUBLIC_SURFACE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity
      # Redirects before the MCP rewrite - see the ordering note at the top of this file.
      # --apply snapshots the existing rules to docs/execution/snapshots/ before writing.
      - name: Apply the redirect rules
        if: inputs.target == 'both' || inputs.target == 'redirects'
        run: python scripts/provision_legacy_redirects.py --apply
      - name: Deploy the MCP Lambda
        if: inputs.target == 'both' || inputs.target == 'mcp'
        run: python scripts/deploy_mcp_server.py

  confirm:
    name: confirm (read-only)
    needs: apply
    if: inputs.action == 'apply'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned AWS SDK
        run: |
          grep -E '^(boto3|botocore)==' requirements-dev.txt > ci-aws-requirements.txt
          python -m pip install -r ci-aws-requirements.txt
      # The read role, not the one that just wrote. A deploy that checks its own work with its
      # own write credential is checking it with the same hand that did it.
      - name: Assume the read-only role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PUBLIC_SURFACE_READ_ROLE_ARN }}
          aws-region: us-east-1
      - name: Who am I
        run: aws sts get-caller-identity
      - name: Confirm the retired URLs now resolve
        if: inputs.target == 'both' || inputs.target == 'redirects'
        run: python scripts/provision_legacy_redirects.py --verify
      - name: Confirm the MCP catalogue is current
        if: inputs.target == 'both' || inputs.target == 'mcp'
        run: python scripts/deploy_mcp_server.py --verify

  summarise:
    name: summarise
    needs: [verify, apply, confirm]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write the summary
        run: |
          {
            echo "### Public surface — ${{ inputs.action }} (${{ inputs.target }})"
            echo ''
            echo '| job | role | result |'
            echo '| --- | --- | --- |'
            echo '| verify | read-only | ${{ needs.verify.result }} |'
            echo '| apply | write | ${{ needs.apply.result }} |'
            echo '| confirm | read-only | ${{ needs.confirm.result }} |'
            echo ''
            echo '`skipped` is the expected result for the jobs the chosen action does not use.'
            echo ''
            echo '- `verify` reads live state and changes nothing. It fails if a retired URL does'
            echo '  not 301 to a live page, or if the deployed MCP Lambda is serving a page'
            echo '  catalogue that disagrees with `config/public-pages.json`.'
            echo '- `apply` rewrites the Amplify custom rules and redeploys the Lambda. Redirects'
            echo '  go first because both write the same rule list and the catch-all ordering'
            echo '  depends on it.'
            echo '- `confirm` re-checks on a credential that cannot write, so the evidence does'
            echo '  not come from the principal that produced the result.'
            echo ''
            echo 'The snapshot written before any rule change is at'
            echo '`docs/execution/snapshots/amplify-custom-rules-before-8.4.json`.'
          } >> "$GITHUB_STEP_SUMMARY"
