name: deps-upgrade-and-lock

# One-shot, manually triggered upgrade that runs on a networked GitHub runner
# (the agent sandbox cannot download npm packages). It regenerates a CLEAN, fully
# consistent lockfile (deletes the stale lock first), optionally bumps all direct
# deps to @latest, verifies with both `npm run build` AND `npm ci` via
# scripts/npm_ci_gate.py, then commits the result back to `stack` (which triggers
# the Amplify deploy). Both gates must pass before anything is committed.
#
# The npm ci gate is blocking but tolerates four known-upstream bundled-dependency
# findings that no change to this repo can fix; any other lockfile-sync finding
# fails the job. See the comment on that step, and scripts/npm_ci_gate.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "lock-only (clean regen of lock) or full-latest (also bump direct deps to @latest)"
        type: choice
        default: lock-only
        options:
          - lock-only
          - full-latest

permissions:
  contents: write

concurrency:
  group: deps-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout stack
        uses: actions/checkout@v7
        with:
          ref: stack

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # For scripts/npm_ci_gate.py. Pinned rather than relying on `python` happening to
      # be on the runner's PATH: the image ships a python3, but an implicit alias is
      # precisely how a gate turns into a silent no-op. Same version and action as
      # build-test.yml and route-auth.yml. The script uses only the standard library, so
      # nothing is installed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bump all direct deps to @latest (full-latest only)
        if: ${{ inputs.mode == 'full-latest' }}
        run: |
          npm install --save --legacy-peer-deps --no-audit --no-fund --package-lock-only \
            next@latest react@latest react-dom@latest react-router-dom@latest \
            aws-amplify@latest @aws-amplify/ui-react@latest \
            @aws-sdk/client-bedrock@latest @aws-sdk/client-bedrock-runtime@latest \
            @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/ios@latest \
            @capacitor/app@latest @capacitor/browser@latest @capacitor/haptics@latest \
            @capacitor/keyboard@latest @capacitor/push-notifications@latest \
            @capacitor/splash-screen@latest @capacitor/status-bar@latest flag-icons@latest
          npm install --save-dev --legacy-peer-deps --no-audit --no-fund --package-lock-only \
            @aws-amplify/backend-cli@latest @aws-amplify/backend-data@latest @aws-amplify/data-construct@latest \
            @aws-amplify/graphql-schema-generator@latest @testing-library/jest-dom@latest @testing-library/react@latest \
            @types/node@latest @types/react@latest @types/react-dom@latest @vitejs/plugin-react@latest \
            jsdom@latest typescript@latest vitest@latest
          npm install --save --legacy-peer-deps --no-audit --no-fund --package-lock-only @aws-amplify/backend@latest

      - name: CLEAN regenerate lockfile (delete stale lock + modules first)
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Gate - build
        run: npm run build

      # BLOCKING, and it tolerates one known-upstream defect (four identical findings)
      # and nothing else.
      #
      # This step used to be non-blocking, and that is what let the lockfile rot:
      # because nothing failed when `npm ci` failed, the committed lockfile drifted
      # until it was missing five entries the tree needs
      # (@aws-cdk/cli-plugin-contract, webpack, @webassemblyjs/ast,
      # @webassemblyjs/wasm-edit, json-schema-traverse). So it must stay blocking.
      #
      # It then went the other way and ran a bare `npm ci --legacy-peer-deps`,
      # asserting in a comment that both spellings were "verified ... exit 0"
      # against a resynced lockfile. That claim was false. Re-measured on `stack`
      # 2026-09-29 (Node 24.21.0 / npm 11.19.0): both fail with four
      # `Missing: @opentelemetry/core@2.0.0 from lock file` errors, because
      # @aws-amplify/data-construct and @aws-amplify/graphql-api-construct bundle
      # OpenTelemetry copies whose pinned @opentelemetry/core@2.0.0 does not match
      # the 2.8.0 bundled beside them. It is inside published tarballs, not here: a
      # clean regen reproduces it and an `overrides` entry crashes npm (exit 134).
      # So a bare `npm ci` gate can never pass, which made this job unable to
      # commit the lockfile it had just regenerated - a brick, not a tripwire.
      #
      # npm_ci_gate.py separates the two failure classes in that one output: the
      # four known upstream edges are tolerated by exact string, and ANY other sync
      # finding still fails the job. Drift detection is kept for the class we cause;
      # the class we cannot fix stops blocking. When upstream is fixed the gate
      # exits 0 and prints a ::notice:: telling us to drop the allowlist, so the
      # workaround cannot outlive its cause. tests/test_npm_ci_gate.py pins that
      # line, including the mixed case where real drift arrives alongside the known
      # finding.
      #
      # The gate compares the lockfile by hash rather than `git diff` because it has
      # deliberately just been regenerated and is expected to differ from HEAD. What
      # must not happen is `npm ci` itself rewriting it.
      - name: Gate - npm ci from clean (catches lockfile drift)
        run: |
          rm -rf node_modules
          python scripts/npm_ci_gate.py -- --legacy-peer-deps

      - name: Commit consistent lockfile + manifest and push (triggers Amplify deploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore(deps): clean-regen consistent lockfile (npm ci verified, mode=${{ inputs.mode }})"
            git push origin stack
          fi

      - name: Residual vulnerability summary
        run: npm audit || true
