# SHADOWED console buildSpec of Amplify app d22dm4b0jn71jw, read live 2026-09-29.
# NOT what runs: amplify.yml in the repository root overrides it. Captured because it is
# an older revision that deletes package-lock.json, has no credential gate, and carries
# only three customHeaders - so it becomes a silent downgrade if amplify.yml ever moves.
# Environment variables are deliberately NOT captured here.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24 || true
        - nvm use 24 || true
        - node -v
        - npm -v
        - rm -f package-lock.json
        - npm install --no-audit --no-fund --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Cache-Control
        value: 'public, max-age=0, must-revalidate'
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
