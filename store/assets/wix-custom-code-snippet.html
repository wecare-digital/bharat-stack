<!-- WECARE.DIGITAL — Custom Code for Wix Dashboard -->
<!-- Go to: Wix Dashboard > Settings > Custom Code > + Add Custom Code -->
<!-- Place in: Head, Load on: All Pages -->

<link rel="stylesheet" href="https://app.wecare.digital/store/assets/wecare-store.css" />

<script>
// WECARE.DIGITAL — Hide native Wix order numbers, show only WD custom order ID
(function() {
  'use strict';

  // Regex patterns for native Wix order numbers
  var NATIVE_ORDER_RE = /^#?\s*\d{4,6}$/;                    // "#10001" or "10001"
  var ORDER_LABEL_RE = /Order\s*#?\s*\d{4,6}/i;              // "Order #10001"
  var ORDER_NUM_RE = /(?:^|\s)#(\d{4,6})(?:\s|$)/;           // " #10001 "
  var WD_ORDER_RE = /WD-ORD\s*-\s*[A-F0-9]{8}\s*-\s*\d{2}-\d{2}-\d{4}\s*-\s*\d{2}:\d{2}:\d{2}\s*-\s*IST/i;  // Our custom format (with spaces around separators)

  function hideNativeOrderNumbers() {
    // Strategy 1: Hide elements with order-number data-hooks (CSS backup)
    var hookSelectors = [
      '[data-hook*="order-number"]',
      '[data-hook*="orderNumber"]',
      '[data-hook*="order_number"]',
      '[data-hook="order-details-title"]',
      '[data-hook="order-page-number"]',
    ];
    hookSelectors.forEach(function(sel) {
      try {
        document.querySelectorAll(sel).forEach(function(el) {
          var text = el.textContent || '';
          // Only hide if it contains a native number pattern (not WD)
          if (!WD_ORDER_RE.test(text) && (NATIVE_ORDER_RE.test(text.trim()) || ORDER_LABEL_RE.test(text))) {
            el.style.cssText = 'display:none!important;visibility:hidden!important;height:0!important;overflow:hidden!important;';
          }
        });
      } catch(e) {}
    });

    // Strategy 2: Walk ALL text nodes looking for native order number patterns
    var walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT,
      null,
      false
    );

    var node;
    var nodesToHide = [];
    while (node = walker.nextNode()) {
      var text = (node.textContent || '').trim();
      if (!text) continue;

      // Skip if it's a WD order number
      if (WD_ORDER_RE.test(text)) continue;

      // Match bare native order numbers: "#10001", "10001", "Order #10001"
      if (NATIVE_ORDER_RE.test(text) || ORDER_LABEL_RE.test(text)) {
        nodesToHide.push(node.parentElement);
      }
    }

    // Hide collected elements
    nodesToHide.forEach(function(el) {
      if (!el) return;
      // Don't hide if the element or its parent contains a WD order number
      var parentText = el.textContent || '';
      if (WD_ORDER_RE.test(parentText)) return;
      el.style.cssText = 'display:none!important;visibility:hidden!important;height:0!important;overflow:hidden!important;';
    });

    // Strategy 3: Find elements whose text is "Order #XXXXX" and replace/hide
    try {
      var allElements = document.querySelectorAll('span, p, div, h1, h2, h3, h4, h5, h6, td, th, li, a, strong, b, em');
      allElements.forEach(function(el) {
        // Only check leaf elements (no child elements with text)
        if (el.children.length > 2) return;
        var text = (el.textContent || '').trim();
        if (!text || text.length > 30) return; // Order numbers are short

        // Skip WD numbers
        if (WD_ORDER_RE.test(text)) return;

        // Hide if it matches native order number pattern
        if (NATIVE_ORDER_RE.test(text) || ORDER_LABEL_RE.test(text) || ORDER_NUM_RE.test(text)) {
          el.style.cssText = 'display:none!important;visibility:hidden!important;height:0!important;overflow:hidden!important;';
        }
      });
    } catch(e) {}
  }

  // Run multiple times to catch dynamically loaded content
  function runHide() {
    hideNativeOrderNumbers();
  }

  // Initial runs with delays (Wix loads content dynamically)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(runHide, 500);
      setTimeout(runHide, 1500);
      setTimeout(runHide, 3000);
      setTimeout(runHide, 5000);
    });
  } else {
    setTimeout(runHide, 300);
    setTimeout(runHide, 1000);
    setTimeout(runHide, 2500);
    setTimeout(runHide, 5000);
  }

  // MutationObserver for SPA navigation and dynamic content
  var debounceTimer;
  var observer = new MutationObserver(function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runHide, 300);
  });

  function startObserver() {
    var target = document.body || document.documentElement;
    if (target) {
      observer.observe(target, { childList: true, subtree: true, characterData: true });
    }
  }

  if (document.body) {
    startObserver();
  } else {
    document.addEventListener('DOMContentLoaded', startObserver);
  }
})();
</script>
