<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Agent API Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #059669;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 8px;
            border-left: 4px solid #059669;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        button {
            background: #059669;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        button:hover {
            background: #047857;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
        }
        .success {
            border-color: #059669;
            background: #f0fdf4;
        }
        .error {
            border-color: #dc2626;
            background: #fef2f2;
            color: #dc2626;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .status.success {
            background: #d1fae5;
            color: #059669;
        }
        .status.error {
            background: #fee2e2;
            color: #dc2626;
        }
        .quick-tests {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .quick-tests button {
            padding: 8px 16px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Floating Agent API Test</h1>
        <p class="subtitle">Test the AI-powered internal agent API directly</p>

        <div class="test-section">
            <h3>API Endpoint Status</h3>
            <p>
                <strong>Endpoint:</strong> https://api.wecare.digital/ai/generate
                <span id="apiStatus" class="status">Testing...</span>
            </p>
            <button onclick="testConnection()">Test Connection</button>
            <div id="connectionResult" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h3>Send Test Query</h3>
            <textarea id="queryInput" rows="3" placeholder="Enter your query (e.g., 'find contact Jignesh', 'show dashboard stats')">help</textarea>
            
            <div class="quick-tests">
                <button onclick="setQuery('help')">Help</button>
                <button onclick="setQuery('find contact Jignesh')">Find Contact</button>
                <button onclick="setQuery('show dashboard stats')">Dashboard Stats</button>
                <button onclick="setQuery('list templates')">List Templates</button>
            </div>
            
            <button onclick="sendQuery()" style="margin-top: 15px;">Send Query</button>
            <div id="queryResult" class="result" style="display:none;"></div>
        </div>

        <div class="test-section">
            <h3>Test Results</h3>
            <div id="testLog" style="color: #666; font-size: 14px;">
                No tests run yet. Click "Test Connection" to start.
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://api.wecare.digital';
        const sessionId = `test-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('testLog');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#059669' : type === 'error' ? '#dc2626' : '#666';
            logDiv.innerHTML += `<div style="color: ${color}; margin-bottom: 5px;">[${timestamp}] ${message}</div>`;
        }

        async function testConnection() {
            const statusEl = document.getElementById('apiStatus');
            const resultEl = document.getElementById('connectionResult');
            
            statusEl.textContent = 'Testing...';
            statusEl.className = 'status';
            resultEl.style.display = 'none';
            
            log('Testing API connection...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/ai/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify({
                        messageContent: 'test connection',
                        context: 'internal-admin',
                        sessionId: sessionId
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    statusEl.textContent = 'Connected ✓';
                    statusEl.className = 'status success';
                    resultEl.className = 'result success';
                    resultEl.textContent = JSON.stringify(data, null, 2);
                    resultEl.style.display = 'block';
                    log('✓ API connection successful!', 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                statusEl.textContent = 'Failed ✗';
                statusEl.className = 'status error';
                resultEl.className = 'result error';
                resultEl.textContent = `Error: ${error.message}`;
                resultEl.style.display = 'block';
                log(`✗ Connection failed: ${error.message}`, 'error');
            }
        }

        function setQuery(text) {
            document.getElementById('queryInput').value = text;
        }

        async function sendQuery() {
            const queryInput = document.getElementById('queryInput');
            const resultEl = document.getElementById('queryResult');
            const query = queryInput.value.trim();
            
            if (!query) {
                alert('Please enter a query');
                return;
            }
            
            resultEl.style.display = 'none';
            log(`Sending query: "${query}"`, 'info');
            
            try {
                const response = await fetch(`${API_BASE}/ai/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify({
                        messageContent: query,
                        context: 'internal-admin',
                        sessionId: sessionId
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultEl.className = 'result success';
                    
                    // Extract the actual response
                    let responseText = '';
                    if (data.body) {
                        try {
                            const parsed = typeof data.body === 'string' ? JSON.parse(data.body) : data.body;
                            responseText = parsed.suggestion || parsed.suggestedResponse || JSON.stringify(parsed, null, 2);
                        } catch (e) {
                            responseText = data.body;
                        }
                    } else {
                        responseText = data.suggestion || data.suggestedResponse || JSON.stringify(data, null, 2);
                    }
                    
                    resultEl.textContent = responseText;
                    resultEl.style.display = 'block';
                    log(`✓ Query successful`, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                resultEl.className = 'result error';
                resultEl.textContent = `Error: ${error.message}`;
                resultEl.style.display = 'block';
                log(`✗ Query failed: ${error.message}`, 'error');
            }
        }

        // Auto-test connection on load
        window.addEventListener('load', () => {
            setTimeout(testConnection, 500);
        });
    </script>
</body>
</html>
