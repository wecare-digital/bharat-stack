version: '3.8'

services:
  freeswitch:
    image: safarov/freeswitch:latest
    container_name: wecare-freeswitch
    network_mode: host
    restart: unless-stopped
    environment:
      - SOUND_RATES=8000:16000
      - SOUND_TYPES=en-us-callie
    volumes:
      # Custom SIP profile for WhatsApp
      - ./config/sip_profiles/whatsapp.xml:/etc/freeswitch/sip_profiles/external/whatsapp.xml
      # Custom dialplan for inbound WhatsApp calls
      - ./config/dialplan/whatsapp_inbound.xml:/etc/freeswitch/dialplan/public/01_whatsapp_inbound.xml
      # Override vars for our external IP
      - ./config/vars_override.xml:/etc/freeswitch/vars_override.xml
      # Shared audio directory for TTS playback
      - ./audio:/tmp/wecare-audio
      # Recording directory
      - ./recordings:/tmp/wecare-recordings
    # host network mode = FreeSWITCH binds directly to host ports
    # Needed for SIP (5060/5061) + RTP (16384-32768)
