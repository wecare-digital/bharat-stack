version: 1
# NOTE: No `backend:` phase. The Amplify Gen2 backend (auth=referenceAuth,
# data, storage) and the 42+ Python Lambdas are deployed SEPARATELY via boto3
# scripts (see scripts/deploy_task12.py etc.) and already exist in AWS — they
# are not managed by `ampx pipeline-deploy`. A pipeline-deploy here would
# collide with those existing resources. CI builds only the frontend, matching
# the last known-good build (job 609). The SEO tools Lambda (wecare-seo-tools)
# is deployed via its own boto3 script.
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24 || true
        - nvm use 24 || true
        - node -v
        - npm -v
        # Proved early and loudly, because the build step below depends on it. If the
        # Amplify image ever ships without python3, this fails here with an obvious
        # cause instead of turning the credential gate into a silent skip.
        - python3 --version
        - rm -rf node_modules/.cache
        - npm install --no-audit --no-fund --legacy-peer-deps
    build:
      commands:
        - npm run build
        # THE REAL CREDENTIAL GATE, and it has to be here rather than only in CI.
        # output:'export' inlines every NEXT_PUBLIC_* value into a JS chunk that is
        # then served to every visitor. GitHub Actions does not have the branch
        # environment variables, so the copy of this check in build-test.yml scans an
        # export that never contained a key and passes for free. THIS build is the one
        # that has them, so this is the only place the check can actually catch a
        # server-side credential being published.
        #
        # Specifically it refuses the unified Google key - one value shared by
        # wecare/google/cloud, wecare/google-api-key and wecare/google-maps, read
        # server-side by wecare-whatsapp-templates. A genuine referrer-restricted Maps
        # browser key passes; that one fails the build before anything deploys.
        # Compares fingerprints only, so no secret is read or printed.
        - python3 scripts/verify_public_bundle_secrets.py
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
customHeaders:
  - pattern: "**/*"
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      # microphone=(self) is required by the Plivo Browser SDK softphone, which
      # calls getUserMedia from this origin. Camera and geolocation stay denied.
      #
      # This value, not the one in next.config.js, is what actually ships. The
      # app is a static export (artifacts baseDirectory: out), so Next.js never
      # runs as a server and its `headers()` entries are inert - they are served
      # only by `next start`. next.config.js already said microphone=(self)
      # while the deployed header said microphone=(), which would have denied the
      # microphone with no visible cause in the code that appeared to configure it.
      #
      # Verify the DEPLOYED header, not the config, with:
      #   python scripts/verify_deployed_headers.py
      - key: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
      # ── Content-Security-Policy, in two headers, deliberately ──────────────────
      #
      # WHY TWO. A single CSP header is all-or-nothing, and the two halves of a useful
      # policy here have very different risk. So the safe-to-enforce directives ship as
      # `Content-Security-Policy` and take effect now, while the aspirational full policy
      # ships as `Content-Security-Policy-Report-Only`, which a browser evaluates and
      # reports on but never blocks. That is a recognised way to adopt CSP without an
      # outage, and it is the only responsible order on a site that takes payments.
      #
      # WHAT CSP CAN AND CANNOT DO ON THIS SITE, stated so nobody over-credits it.
      # next.config.js sets `output: 'export'`, so there is no server to mint a per-request
      # nonce and Next's hydration bootstrap is an inline <script>. A `script-src` without
      # `'unsafe-inline'` would therefore break every page, and `'unsafe-inline'` defeats
      # most of what `script-src` is for. So CSP here is NOT meaningful XSS protection.
      # What it genuinely buys is the three directives below plus, once the report-only
      # policy has been reviewed, a real constraint on where images, fonts, frames and
      # network connections may come from.
      #
      # ENFORCED NOW, because none of these can break this site:
      #   object-src 'none'     there is no <object> or <embed> anywhere in the export
      #   base-uri 'self'       nothing sets <base>; this stops an injected one
      #                         re-pointing every relative URL on the page
      #   frame-ancestors 'self'  clickjacking. Overlaps X-Frame-Options: SAMEORIGIN
      #                         above, but frame-ancestors is the modern directive and is
      #                         the one still honoured where X-Frame-Options is ignored
      - key: Content-Security-Policy
        value: "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
      # REPORT-ONLY, so this cannot break anything while it is being proved out.
      #
      # The origin list is derived from the built export rather than guessed: fonts from
      # Google, Razorpay Checkout for payments, the Plivo Browser SDK for the softphone
      # (which is also why Permissions-Policy grants microphone=(self)), Cognito for auth,
      # the CloudFront distribution behind /get/ for file delivery, and static.wixstatic.com
      # for blog cover images.
      #
      # IT IS ALMOST CERTAINLY STILL INCOMPLETE, and that is the point of shipping it this
      # way. Static analysis of a bundle cannot find an origin that is only contacted on a
      # code path nobody exercised - a payment retry, a call transfer, a map lookup. The
      # next step is to read the violation reports and tighten, NOT to promote this to
      # enforcing on the assumption the list is right.
      #
      # NOTE: with no `report-to` endpoint configured, violations appear in the browser
      # console only - nothing is transmitted anywhere. That is enough for a deliberate
      # review pass across the public pages, the checkout and the softphone, and it avoids
      # standing up a collector for a policy that is not enforcing yet. Add `report-to` and
      # a Reporting-Endpoints header when the tightening pass starts in earnest.
      - key: Content-Security-Policy-Report-Only
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://checkout.razorpay.com https://api.razorpay.com
            https://*.plivo.com https://www.googletagmanager.com
            https://connect.facebook.net;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob: https://static.wixstatic.com
            https://img.icons8.com https://*.cloudfront.net
            https://www.googletagmanager.com https://www.facebook.com;
          connect-src 'self' https://wecare.digital https://*.execute-api.us-east-1.amazonaws.com
            https://cognito-idp.us-east-1.amazonaws.com
            https://cognito-identity.us-east-1.amazonaws.com
            https://api.razorpay.com https://lumberjack.razorpay.com
            https://*.plivo.com wss://*.plivo.com
            https://*.cloudfront.net https://www.googletagmanager.com;
          media-src 'self' blob: https://*.cloudfront.net;
          frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com;
          worker-src 'self' blob:;
          manifest-src 'self';
          object-src 'none';
          base-uri 'self';
          frame-ancestors 'self';
          form-action 'self'
